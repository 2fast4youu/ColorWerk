name: ColorWerk prüfen und bauen
on:
  workflow_dispatch:
  push:
    tags:
      - '*-de*'
permissions:
  contents: write
jobs:
  verify-build:
    if: github.repository == '2fast4youu/ColorWerk'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Deutsche Ressourcen prüfen
        run: python3 scripts/test_german_resources.py
      - name: Signierschlüssel vorübergehend wiederherstellen
        env:
          KEYSTORE_B64: ${{ secrets.COLORWERK_RELEASE_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.COLORWERK_RELEASE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          folder = Path('keystore')
          folder.mkdir(mode=0o700, exist_ok=True)
          key = folder / 'colorwerk.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'], validate=True))
          key.chmod(0o600)
          password = os.environ['KEY_PASSWORD']
          props = folder / 'keystore.properties'
          props.write_text(f'storeFile={key.resolve()}\nstorePassword={password}\nkeyAlias=colorwerk\nkeyPassword={password}\n')
          props.chmod(0o600)
          PY
      - name: Tests, Lint und signierte Release-APK
        run: >-
          bash gradlew clean testDebugUnitTest lintDebug assembleRelease --continue
          --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          --console=plain
      - name: APK-Signatur prüfen
        env:
          EXPECTED_CERT: ${{ vars.COLORWERK_RELEASE_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          apk = glob.glob('app/build/outputs/apk/release/*.apk')
          assert len(apk) == 1, apk
          signer = sorted(glob.glob(os.environ['ANDROID_HOME'] + '/build-tools/*/apksigner'))[-1]
          result = subprocess.check_output([signer, 'verify', '--print-certs', apk[0]], text=True)
          digest = re.search(r'Signer\s+#\d+\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F]{64})', result).group(1)
          assert digest.lower() == os.environ['EXPECTED_CERT'].lower()
          print('APK-Signatur entspricht dem eigenen ColorWerk-Schlüssel.')
          PY
      - name: APK und Prüfberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ColorWerk-build
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/reports/colorwerk-preview/
      - name: Release auf GitHub veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          notes='Deutscher ColorWerk-Fork von LuckyTool. Eigene Paketkennung und Signatur, arm64-v8a. Benötigt ein passendes LSPosed-/Xposed-Framework. Kein direktes Update über das Original; ColorOS-Hooks nicht auf jedem Gerät geprüft.'
          gh release create "$TAG" app/build/outputs/apk/release/*.apk --repo "$GITHUB_REPOSITORY" --title "ColorWerk 1.3.5-de.1" --notes "$notes" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url
      - name: Schlüssel entfernen
        if: always()
        run: rm -rf keystore
