name: ColorWerk prüfen und bauen
on:
  workflow_dispatch:
  push:
    tags:
      - '*-de*'
permissions:
  contents: write
jobs:
  verify-build:
    if: github.repository == '2fast4youu/ColorWerk'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Deutsche Ressourcen prüfen
        run: python3 scripts/test_german_resources.py
      - name: Signierschlüssel vorübergehend wiederherstellen
        env:
          KEYSTORE_B64: ${{ secrets.COLORWERK_RELEASE_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.COLORWERK_RELEASE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          folder = Path('keystore')
          folder.mkdir(mode=0o700, exist_ok=True)
          key = folder / 'colorwerk.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'], validate=True))
          key.chmod(0o600)
          password = os.environ['KEY_PASSWORD']
          props = folder / 'keystore.properties'
          props.write_text(f'storeFile={key.resolve()}\nstorePassword={password}\nkeyAlias=colorwerk\nkeyPassword={password}\n')
          props.chmod(0o600)
          PY
      - name: Tests, Lint und signierte Release-APK
        run: >-
          bash gradlew clean testDebugUnitTest lintDebug assembleRelease --continue
          --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          --console=plain
      - name: APK-Signatur prüfen
        env:
          EXPECTED_CERT: ${{ vars.COLORWERK_RELEASE_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, hashlib, zipfile
          apk = glob.glob('app/build/outputs/apk/release/*.apk')
          assert len(apk) == 1, apk
          signer = sorted(glob.glob(os.environ['ANDROID_HOME'] + '/build-tools/*/apksigner'))[-1]
          subprocess.check_call([signer, 'verify', apk[0]])
          with zipfile.ZipFile(apk[0]) as archive:
              certs = [n for n in archive.namelist() if re.fullmatch(r'META-INF/[^/]+\.(RSA|DSA|EC)', n)]
              assert len(certs) == 1, certs
              block = archive.read(certs[0])
          marker = bytes.fromhex('06092a864886f70d010702a0')
          position = block.find(marker)
          assert position >= 0, 'PKCS7 SignedData missing'
          def child(i):
              length_byte = block[i + 1]
              header = 1 + (length_byte & 0x7f if length_byte & 0x80 else 0)
              return i + 1 + header
          def end(i):
              length_byte = block[i + 1]
              header = 1 + (length_byte & 0x7f if length_byte & 0x80 else 0)
              length = int.from_bytes(block[i + 2:i + 2 + (length_byte & 0x7f)], 'big') if length_byte & 0x80 else length_byte
              return i + 1 + header + length
          i = child(position + len(marker) - 1)
          assert block[i] == 0x30
          i = child(i)
          assert block[i:i + 3] == bytes.fromhex('020101')
          i += 3
          assert block[i] == 0x31
          i = end(i)
          assert block[i] == 0x30
          i = end(i)
          assert block[i] == 0xa0
          cert_start = child(i)
          assert block[cert_start] == 0x30
          cert_end = end(cert_start)
          digest = hashlib.sha256(block[cert_start:cert_end]).hexdigest()
          assert digest.lower() == os.environ['EXPECTED_CERT'].lower(), 'Unexpected signing certificate'
          print('APK-Signatur entspricht dem eigenen ColorWerk-Schlüssel.')
          PY
      - name: APK und Prüfberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ColorWerk-build
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/reports/colorwerk-preview/
      - name: Release auf GitHub veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          notes='Deutscher ColorWerk-Fork von LuckyTool. Eigene Paketkennung und Signatur, arm64-v8a. Benötigt ein passendes LSPosed-/Xposed-Framework. Kein direktes Update über das Original; ColorOS-Hooks nicht auf jedem Gerät geprüft.'
          gh release create "$TAG" app/build/outputs/apk/release/*.apk --repo "$GITHUB_REPOSITORY" --title "ColorWerk $VERSION" --notes "$notes" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url
      - name: Schlüssel entfernen
        if: always()
        run: rm -rf keystore
